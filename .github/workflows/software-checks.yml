name: Software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numerical-and-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Fetch exact model assets used by the integration tests
        run: |
          git init microduck_rl
          git -C microduck_rl remote add origin https://github.com/pollen-robotics/microduck_rl.git
          git -C microduck_rl fetch --depth 1 origin 0daab160d3fb1c2cbaba16a4a19052f36709dd9e
          git -C microduck_rl checkout --detach FETCH_HEAD
      - run: python -m pytest tests ros2/duck_nav/test -q
      - run: python -m compileall -q scripts ros2/duck_nav/duck_nav ros2/duck_nav/launch
